name: Release

# 职责：发布 @amiriel/core，并向下游 dispatch（Sync Core 会自行完整发 npm）。
# 下游不依赖本仓再触发它们的 Release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag override (auto = derive from package.json semver)"
        required: false
        default: "auto"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Resolve release channel
        id: release
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag || 'auto' }}
        run: bash .github/scripts/resolve-release.sh

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="${{ steps.release.outputs.version }}"
          NPM_TAG="${{ steps.release.outputs.npm_tag }}"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance --tag "${NPM_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          PRERELEASE_ARGS=()
          if [ "${{ steps.release.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          # workflow_dispatch 时远程可能尚无 tag；--verify-tag 要求 tag 已存在。
          # 由 tag push 触发时此处为 no-op。用 GITHUB_TOKEN 推 tag 不会再次触发本 workflow。
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "amirieljs-bot"
            git config user.email "actions@users.noreply.github.com"
            if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
              git tag "${TAG}"
            fi
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --generate-notes --verify-tag "${PRERELEASE_ARGS[@]}"
          fi

      - name: Dispatch framework package sync
        env:
          TOKEN: ${{ secrets.AMIRIELJS_SYNC_TOKEN }}
          VERSION: v${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "AMIRIELJS_SYNC_TOKEN is not configured; skipping framework sync dispatch."
            exit 0
          fi
          CORE_VERSION="${VERSION#v}"
          for REPO in Amiriel Amiriel-Vue Amiriel-React Amiriel-Vanilla; do
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Amirieljs/${REPO}/dispatches" \
              -d "{\"event_type\":\"core-release\",\"client_payload\":{\"version\":\"${CORE_VERSION}\",\"npm_tag\":\"${NPM_TAG}\"}}"
          done
