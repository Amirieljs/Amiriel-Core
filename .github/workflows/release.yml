name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag"
        required: false
        default: "beta"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag || 'beta' }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance --tag "${NPM_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --generate-notes --verify-tag
          fi

      - name: Dispatch framework package sync
        env:
          TOKEN: ${{ secrets.AMIRIELJS_SYNC_TOKEN }}
          VERSION: ${{ github.ref_name }}
          NPM_TAG: ${{ inputs.npm_tag || 'beta' }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "AMIRIELJS_SYNC_TOKEN is not configured; skipping framework sync dispatch."
            exit 0
          fi
          CORE_VERSION="${VERSION#v}"
          for REPO in Amiriel-Vue Amiriel-React; do
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Amirieljs/${REPO}/dispatches" \
              -d "{\"event_type\":\"core-release\",\"client_payload\":{\"version\":\"${CORE_VERSION}\",\"npm_tag\":\"${NPM_TAG}\"}}"
          done
